name: Compile Kernel PYS110

on:
  workflow_dispatch:
   inputs:
      susfs:
        description: "为本内核开启SuSFS支持"
        required: true
        type: boolean
        default: false

jobs:
  Kernel:
    env:
        GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
          
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          dwarves \
          gcc-aarch64-linux-gnu \
          linux-tools-common 
          
      - name: Clone Kernel Source
        run: |
          git clone https://github.com/TheWeienKernelProject/android_WeienKernel_oneplus_mt6878.git --depth=1 -b Test mt6878
          git clone https://github.com/mmyesyee/android_WeienKernel_modules_and_devicetree_oneplus_mt6878 --depth=1 -b oneplus/mt6878_b_16.0_turbo_6x modules
          cp -r ${GITHUB_WORKSPACE}/modules/vendor ${GITHUB_WORKSPACE}/ 
          cp -r ${GITHUB_WORKSPACE}/modules/kernel ${GITHUB_WORKSPACE}/
          
      - name: Download AOSP Clang
        run: |
              curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-qpr3-release/clang-r487747c.tar.gz

              mkdir -p toolchains/clang-r487747c
          
              tar -xf "clang-r487747c.tar.gz" -C "toolchains/clang-r487747c"
              
      - name: Include Patch
        run: |
              cd mt6878
              curl -Lo ds.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
              patch -p1 < ds.patch || true

              cd ${GITHUB_WORKSPACE}
              # git clone https://github.com/Sakion-Team/Re-Kernel/ -b main --depth=1
              git clone https://github.com/maxsteeel/nomount/ -b master --depth=1
              mkdir ${GITHUB_WORKSPACE}/mt6878/fs/nomount
              # mkdir ${GITHUB_WORKSPACE}/mt6878/drivers/rekernel
              # cp ${GITHUB_WORKSPACE}/Re-Kernel/Integrate/rekernel/* ${GITHUB_WORKSPACE}/mt6878/drivers/rekernel
              cp ${GITHUB_WORKSPACE}/nomount/kernel/src/* ${GITHUB_WORKSPACE}/mt6878/fs/nomount
              cd ${GITHUB_WORKSPACE}/mt6878/
              # bash ${GITHUB_WORKSPACE}/Re-Kernel/Integrate/patches.sh 
              bash ${GITHUB_WORKSPACE}/nomount/kernel/setup.sh 
              # sed -i 's/%d\([^"]*netlink_unit\)/%lu\1/g' drivers/rekernel/rekernel.c
              # sed -i 's/task_uid(dst).val, rpc_type\[type\], -1/task_uid(dst).val/' drivers/rekernel/rekernel.c
              # sed -i 's/%d\\n", netlink_unit/%lu\\n", netlink_unit/g; s/%d\\n", netlink_unit/%lu\\n", netlink_unit/g; s/%d", netlink_unit/%lu", netlink_unit/g' drivers/rekernel/rekernel.c
              # sed -i 's/static const char\* rpc_type\[\]/static const char* rpc_type[] __attribute__((unused))/' drivers/rekernel/rekernel.c

              if [[ "${{ inputs.susfs }}" == "true" ]]; then
              git clone https://github.com/ReSukiSU/ReSukiSU --depth=1
              cd ${GITHUB_WORKSPACE}/mt6878
              bash ${GITHUB_WORKSPACE}/ReSukiSU/kernel/setup.sh
              git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android14-6.1 --depth=1 susfs
              cp susfs/kernel_patches/50_enable_susfs_for_ksu.patch KernelSU/
              cd KernelSU
              patch -p1 < 50_enable_susfs_for_ksu.patch 
              cd ../
              patch -p1 < susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
              cp susfs/kernel_patches/fs/* fs/
              cp susfs/kernel_patches/include/linux/* include/linux/
              fi
              
      - name: Make Confiig & Build Kernel Image
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang-r487747c/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="twkp" 
          export KBUILD_BUILD_HOST="liuweien339-sys"
          
          cd mt6878
          make PYS110_defconfig other.config
          
          if [[ "${{ inputs.susfs }}" == "true" ]]; then
          sed -i '/CONFIG_KSU_SUSFS/d' .config
          echo "CONFIG_KSU_SUSFS=y" >> .config
          fi
          
          make -j$(nproc) Image 2>&1 | tee ${GITHUB_WORKSPACE}/build.log

      - name: Make AnyKernel3
        run: |
          ZIP_NAME="kernel"
          git clone https://github.com/liuweien339-sys/AnyKernel3.git ak3
          cp mt6878/arch/arm64/boot/Image ak3/
          cp build.log ak3/
          cd ak3 

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Upload to GitHub Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
         name: Turbo6XKernel
         path: |
          ak3/*
         if-no-files-found: error
         compression-level: 6
