name: Compile Kernel + All Vendor Modules

on:
  workflow_dispatch:
    inputs:
      susfs:
        description: "为本内核开启SuSFS支持"
        required: true
        type: boolean
        default: false

jobs:
  Kernel:
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libssl-dev libelf-dev libdw-dev build-essential dwarves \
            gcc-aarch64-linux-gnu linux-tools-common \
            bc bison flex rsync cpio python3

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/TheWeienKernelProject/android_WeienKernel_oneplus_mt6878.git --depth=1 -b Test mt6878
          git clone https://github.com/mmyesyee/android_WeienKernel_modules_and_devicetree_oneplus_mt6878 --depth=1 -b oneplus/mt6878_b_16.0_turbo_6x modules
          cp -r ${GITHUB_WORKSPACE}/modules/vendor ${GITHUB_WORKSPACE}/
          cp -r ${GITHUB_WORKSPACE}/modules/kernel ${GITHUB_WORKSPACE}/

      - name: Download AOSP Clang
        run: |
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-qpr3-release/clang-r487747c.tar.gz
          mkdir -p toolchains/clang-r487747c
          tar -xf "clang-r487747c.tar.gz" -C "toolchains/clang-r487747c"

      - name: Include Patch
        run: |
          cd mt6878
          curl -Lo ds.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          patch -p1 < ds.patch || true

          cd ${GITHUB_WORKSPACE}
          git clone https://github.com/maxsteeel/nomount/ -b master --depth=1
          mkdir -p ${GITHUB_WORKSPACE}/mt6878/fs/nomount
          cp ${GITHUB_WORKSPACE}/nomount/kernel/src/* ${GITHUB_WORKSPACE}/mt6878/fs/nomount
          cd ${GITHUB_WORKSPACE}/mt6878/
          bash ${GITHUB_WORKSPACE}/nomount/kernel/setup.sh

          if [[ "${{ inputs.susfs }}" == "true" ]]; then
            git clone https://github.com/ReSukiSU/ReSukiSU --depth=1
            cd ${GITHUB_WORKSPACE}/mt6878
            bash ${GITHUB_WORKSPACE}/ReSukiSU/kernel/setup.sh
            git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android14-6.1 --depth=1 susfs
            cp susfs/kernel_patches/50_enable_susfs_for_ksu.patch KernelSU/
            cd KernelSU
            patch -p1 < 50_enable_susfs_for_ksu.patch
            cd ../
            patch -p1 < susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
            cp susfs/kernel_patches/fs/* fs/
            cp susfs/kernel_patches/include/linux/* include/linux/
          fi

      - name: Make Config & Build Kernel + All Modules
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang-r487747c/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="twkp"
          export KBUILD_BUILD_HOST="liuweien339-sys"
          export KCFLAGS="-Wno-error"

          cd mt6878
          make PYS110_defconfig other.config

          if [[ "${{ inputs.susfs }}" == "true" ]]; then
            sed -i '/CONFIG_KSU_SUSFS/d' .config
            echo "CONFIG_KSU_SUSFS=y" >> .config
          fi

          # 编内核 Image + 内核内建 obj-m 模块（比如 net/wireless/*.ko）
          make -j$(nproc) Image modules 2>&1 | tee ${GITHUB_WORKSPACE}/build.log

      - name: Build Vendor Modules (WLAN/conninfra/connfem/...)
        run: |
          export PATH="${GITHUB_WORKSPACE}/toolchains/clang-r487747c/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error"

          cd mt6878

          # 从 build.config.mtk_kernel_device_modules 抄的 EXT_MODULES
          VENDOR_MODULES="
          kernel_device_modules-6.1
          ../vendor/mediatek/kernel_modules/connectivity/common
          ../vendor/mediatek/kernel_modules/connectivity/conninfra
          ../vendor/mediatek/kernel_modules/connectivity/conninfra_mt6653
          ../vendor/mediatek/kernel_modules/connectivity/connfem
          ../vendor/mediatek/kernel_modules/connectivity/gps/gps_stp
          ../vendor/mediatek/kernel_modules/connectivity/gps/data_link
          ../vendor/mediatek/kernel_modules/connectivity/gps/gps_pwr
          ../vendor/mediatek/kernel_modules/connectivity/gps/gps_scp
          ../vendor/mediatek/kernel_modules/gpu
          ../vendor/mediatek/kernel_modules/connectivity/fmradio
          ../vendor/mediatek/kernel_modules/connectivity/wlan/adaptor
          ../vendor/mediatek/kernel_modules/connectivity/wlan/adaptor_mt6653
          ../vendor/mediatek/kernel_modules/connectivity/wlan/adaptor/wlan_page_pool
          ../vendor/mediatek/kernel_modules/connectivity/bt/linux_v2
          ../vendor/mediatek/kernel_modules/connectivity/bt/linux_v2_mt6653
          ../vendor/mediatek/kernel_modules/hbt_driver_cus
          ../vendor/mediatek/kernel_modules/mtkcam
          ../vendor/tests/kernel/ktf_testcase
          "

          for d in $VENDOR_MODULES; do
            if [ -d "$d" ]; then
              echo "=== Building vendor module: $d ==="
              make -j$(nproc) -C "$d" M="$d" KERNEL_SRC="$PWD" O="$PWD" modules \
                  2>&1 | tail -20 | tee -a ${GITHUB_WORKSPACE}/build.log
            else
              echo "=== SKIP (not found): $d ==="
            fi
          done

      - name: Collect all modules
        run: |
          mkdir -p all_modules
          find ${GITHUB_WORKSPACE}/mt6878 -name "*.ko" -type f 2>/dev/null | while read f; do
            rel="${f#${GITHUB_WORKSPACE}/mt6878/}"
            mkdir -p "all_modules/$(dirname "$rel")"
            cp "$f" "all_modules/$rel"
          done

          echo "=== 模块总数 ==="
          find all_modules -name "*.ko" | wc -l
          echo "=== WLAN 相关 ==="
          find all_modules -name "*.ko" | grep -iE "wlan|conn|gen4m" | head -20

          cd all_modules
          tar -czf ${GITHUB_WORKSPACE}/kernel-modules.tar.gz .
          cd ${GITHUB_WORKSPACE}
          ls -lh kernel-modules.tar.gz

      - name: Make AnyKernel3
        run: |
          ZIP_NAME="kernel"
          git clone https://github.com/liuweien339-sys/AnyKernel3.git ak3
          cp mt6878/arch/arm64/boot/Image ak3/
          cp build.log ak3/
          cd ak3
          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Upload Kernel (AnyKernel3)
        uses: actions/upload-artifact@v4
        with:
          name: Turbo6XKernel
          path: ak3/*
          if-no-files-found: error
          compression-level: 6

      - name: Upload All Kernel Modules
        uses: actions/upload-artifact@v4
        with:
          name: KernelModules
          path: kernel-modules.tar.gz
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog
          path: build.log
          if-no-files-found: warn
